services:
  group2-mysql:
    image: mysql:8.0
    container_name: it4788_mysql
    env_file: .env.prod
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${DB_NAME}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
    restart: always
    networks:
      - proxy-net

  group2-redis:
    image: redis:latest
    env_file: .env.prod
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ./redis-data:/data
    restart: always
    networks:
      - proxy-net

  mysql-test:
    image: mysql:8.0
    container_name: it4788_mysql_test
    env_file: .env.prod
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: it4788_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "32768:3306"
    volumes:
      - ./mysql_data_test:/var/lib/mysql
    restart: always
    networks:
      - proxy-net

  group2-api:
    image: ghcr.io/congktx/it4788:latest
    # build: .
    container_name: it4788_app
    ports:
      - "${PORT}:${PORT}"
    env_file: .env.prod
    # volumes:
    #   - .:/app
    #   - /app/node_modules
    command: sh -c "node dist/src/sync-elasticsearch.js && node dist/src/main.js"
    depends_on:
      group2-elasticsearch:
          condition: service_healthy
      group2-mysql:
          condition: service_started
      group2-redis:
          condition: service_started
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.group2-api.rule=Host(`group2.it4788.sukkaito.id.vn`)"
      - "traefik.http.routers.group2-api.entrypoints=websecure"
      - "traefik.http.routers.group2-api.tls=true"
      - "traefik.http.routers.group2-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.group2-api.loadbalancer.server.port=8001"
    networks:
      - proxy-net

  group2-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    container_name: it4788_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.authc.api_key.enabled=true
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9201:9200"
    volumes:
      - ./elasticsearch_data:/usr/share/elasticsearch/data
    restart: always
    networks:
      - proxy-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -u ${ELASTICSEARCH_USERNAME}:${ELASTICSEARCH_PASSWORD} http://localhost:9200/_cluster/health >/dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  proxy-net:
    external: true

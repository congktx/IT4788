version: '3.8'

services:
  # ---------------------------------------------------
  # 1. DATABASE CHÍNH (Cổng 3306)
  # ---------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: it4788_mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${DB_NAME}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

  # ---------------------------------------------------
  # 2. DATABASE TEST (Cổng 3307)
  # ---------------------------------------------------
  mysql-test:
    image: mysql:8.0
    container_name: it4788_mysql_test
    environment:
      MYSQL_ROOT_PASSWORD: test_root
      MYSQL_DATABASE: it4788_db_test
    ports:
      - "3307:3306"
    tmpfs:
      - /var/lib/mysql

  # ---------------------------------------------------
  # 3. REDIS SERVER (Cổng 6379)
  # ---------------------------------------------------
  redis:
    image: redis:alpine
    container_name: it4788_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  mysql_data:
